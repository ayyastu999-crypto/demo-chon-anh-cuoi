<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A1512">
<meta name="robots" content="noindex">
<title>Đăng nhập · Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#6B231E;--wine-d:#4A1512;--cream:#FBF8EF;--text:#2A1A15;--muted:#7C5B52;--line:#E9DDD5;--danger:#B3261E}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:16px;color:var(--text);
  background:radial-gradient(ellipse at 50% 0,#7A2A23,var(--wine-d) 70%)}
.box{width:100%;max-width:400px;background:var(--cream);border-radius:24px;padding:32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:up .4s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.logo{width:56px;height:56px;border-radius:50%;background:var(--wine);color:var(--cream);display:grid;place-items:center;font:italic 600 30px 'Cormorant Garamond',serif;margin:0 auto 14px}
h1{font:600 36px/1.1 'Cormorant Garamond',serif;text-align:center}
.sub{text-align:center;color:var(--muted);margin:6px 0 22px;font-size:15px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}
input:focus{outline:2px solid var(--wine);border-color:transparent}
.pw{position:relative}
.pw input{padding-right:84px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:36px;padding:0 10px;border:0;background:none;color:var(--wine);font:600 14px inherit;cursor:pointer}
.go{width:100%;min-height:50px;margin-top:22px;border:0;border-radius:999px;background:var(--wine);color:var(--cream);font:600 16px 'Be Vietnam Pro',sans-serif;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.err{margin-top:14px;padding:12px 14px;border-radius:12px;background:#FBE9E6;color:var(--danger);font-size:15px}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;background:#FCF0E0;color:var(--text);font-size:14px;line-height:1.5}
:focus-visible{outline:3px solid rgba(153,45,37,.45);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="box">
  <div class="logo" aria-hidden="true">S</div>
  <h1>Chọn ảnh cưới</h1>
  <p class="sub">Đăng nhập trang quản lý của studio</p>
  <form id="f" novalidate>
    <label for="ten">Tên đăng nhập</label>
    <input id="ten" name="ten" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="mk">Mật khẩu</label>
    <div class="pw"><input id="mk" name="matKhau" type="password" autocomplete="current-password" required><button type="button" id="hien" aria-controls="mk">Hiện</button></div>
    <button class="go" id="go">Đăng nhập</button>
    <p class="err" id="err" role="alert" hidden></p>
    <p class="note" id="chuaCo" hidden>Studio chưa đặt mật khẩu. Trên máy chạy app, mở thư mục <b>demo-chon-anh-cuoi</b> và chạy <b>npm run dat-mat-khau</b>.</p>
  </form>
</main>
<script>
const $ = s => document.querySelector(s);
fetch('/api/dang-nhap/trang-thai').then(r => r.json()).then(d => { $('#chuaCo').hidden = d.daCoTaiKhoan; }).catch(() => {});
$('#hien').onclick = () => { const an = $('#mk').type === 'password'; $('#mk').type = an ? 'text' : 'password'; $('#hien').textContent = an ? 'Ẩn' : 'Hiện'; };
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('#err'), go = $('#go'); err.hidden = true;
  if (!$('#ten').value.trim() || !$('#mk').value) { err.textContent = 'Nhập tên đăng nhập và mật khẩu.'; err.hidden = false; return; }
  go.disabled = true; go.textContent = 'Đang đăng nhập…';
  try {
    const r = await fetch('/api/dang-nhap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ten: $('#ten').value, matKhau: $('#mk').value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.loi || 'Không đăng nhập được');
    location.href = '/';
  } catch (ex) { err.textContent = ex.message; err.hidden = false; $('#mk').select(); }
  go.disabled = false; go.textContent = 'Đăng nhập';
});
$('#ten').focus();
</script>
</body>
</html>
